name: Collect Official Source Pack

on:
  push:
    paths:
      - 'source_requests/*.json'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          SHA='${{ github.sha }}'
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            REQ=$(git ls-tree -r --name-only "$SHA" | grep '^source_requests/.*\.json$' | tail -n 1)
          else
            REQ=$(git diff --name-only "$BEFORE" "$SHA" | grep '^source_requests/.*\.json$' | tail -n 1)
          fi
          test -n "$REQ"
          NAME=$(basename "$REQ" .json)
          echo "path=$REQ" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Collect limited official excerpts
        run: python automation/collect_webtoon.py '${{ steps.req.outputs.path }}' 'source_packs/${{ steps.req.outputs.name }}'

      - name: Upload source research pack
        uses: actions/upload-artifact@v4
        with:
          name: source-pack-${{ steps.req.outputs.name }}
          path: source_packs/${{ steps.req.outputs.name }}
          if-no-files-found: error
          retention-days: 7
